services:
    ngnt-geiger-flask:
        build:
            context: .
            dockerfile: ./Dockerfiles/DockerfileFlask
        container_name: ngnt-geiger-flask
        restart: unless-stopped
        # Runs as uid 1000 (DockerfileFlask) and needs no capability. Its writes are
        # data/, config/mosquitto/ (both mounted below) and gunicorn's worker
        # heartbeat files in /tmp.
        security_opt: ["no-new-privileges:true"]
        cap_drop: [ALL]
        read_only: true
        tmpfs:
            - /tmp:size=16m
        pids_limit: 64
        mem_limit: 256m
        ports:
            - ${FLASK_PORTS}
        environment:
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
            FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
            SITE_NAME: ${SITE_NAME:-NGNT Geiger Counter}
            TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
            MOSQUITTO_CONFIG_DIR: /app/mosquitto-config
        # The app read-only at /src, outside /app: mounts nested inside a
        # bind-mounted app/ would leave root-owned dirs in the checkout.
        working_dir: /src
        volumes:
            - ./app:/src:ro
            - ./config/mosquitto:/app/mosquitto-config
            - ./data:/app/data
        depends_on:
            - ngnt-geiger-mariadb
        networks:
            ngnt-geiger-network:
                ipv4_address: ${IPV4_NETWORK}.10
                aliases:
                    - flask

    ngnt-geiger-mariadb:
        image: mariadb:${DOCKER_IMAGE_MARIADB_TAG}
        container_name: ngnt-geiger-mariadb
        restart: unless-stopped
        # The entrypoint starts as root, chowns the data directory and drops to mysql
        # (uid 999) with gosu. That needs four capabilities; the rest is gone.
        security_opt: ["no-new-privileges:true"]
        cap_drop: [ALL]
        cap_add:
            - CHOWN            # chown of the data directory
            - DAC_READ_SEARCH  # root walks a directory it does not own
            - SETGID           # gosu: drop to mysql
            - SETUID
        # Threads count as pids: max_connections (151) plus InnoDB's background threads fit.
        pids_limit: 512
        mem_limit: 1g
        expose:
            - 3306
        environment:
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
            MARIADB_TIMEZONE: ${MARIADB_TIMEZONE}
            # Upgrade an existing data directory in place when the image moves to a newer major (dump first).
            MARIADB_AUTO_UPGRADE: "1"
        volumes:
            - ./volumes/mariadb:/var/lib/mysql
            - ./dbinit.sql:/docker-entrypoint-initdb.d/init.sql:ro
            - ./config/mariadb/event-scheduler.cnf:/etc/mysql/conf.d/event-scheduler.cnf:ro
        networks:
            ngnt-geiger-network:
                ipv4_address: ${IPV4_NETWORK}.20
                aliases:
                    - mariadb

    ngnt-geiger-mosquitto:
        build:
            context: .
            dockerfile: ./Dockerfiles/DockerfileMosquitto
        container_name: ngnt-geiger-mosquitto
        restart: unless-stopped
        # scripts/mosquitto/docker-entrypoint.sh runs as root next to the broker (uid 1883).
        security_opt: ["no-new-privileges:true"]
        cap_drop: [ALL]
        cap_add:
            - CHOWN         # certificates, data/ and log/ go to mosquitto; passwd.txt to root
            - DAC_OVERRIDE  # passwd.txt and .reload live in config/mosquitto, which belongs to uid 1000
            - FOWNER        # chmod 600 of the keys after they went to mosquitto
            - KILL          # the reload watcher signals the broker, which runs as uid 1883
            - SETGID        # the broker drops from root to mosquitto
            - SETUID
        pids_limit: 64
        mem_limit: 128m
        ports:
            - ${MOSQUITTO_PORTS}
            - ${MOSQUITTO_PORTS_TLS}
        environment:
          MQTT_PYTHON_USER: ${MQTT_PYTHON_USER}
          MQTT_PYTHON_USERPW: ${MQTT_PYTHON_USERPW}
        volumes:
            - ./config/mosquitto:/mosquitto/config
            - ./log/mosquitto/:/mosquitto/log/
            - ./volumes/mosquitto/data:/mosquitto/data/
            - ./volumes/mosquitto/certs:/mosquitto/certs
            - ./scripts/mosquitto/docker-entrypoint.sh:/docker-entrypoint.sh:ro

        networks:
            ngnt-geiger-network:
                ipv4_address: ${IPV4_NETWORK}.30
                aliases:
                    - mosquitto


    ngnt-geiger-subscriber:
        build:
            context: .
            dockerfile: ./Dockerfiles/DockerfileSubscriber
        container_name: ngnt-geiger-subscriber
        restart: unless-stopped
        # Runs as its own unprivileged user and writes nothing.
        security_opt: ["no-new-privileges:true"]
        cap_drop: [ALL]
        read_only: true
        pids_limit: 64
        mem_limit: 128m
        environment:
          MARIADB_DATABASE: ${MARIADB_DATABASE}
          MARIADB_USER: ${MARIADB_USER}
          MARIADB_PASSWORD: ${MARIADB_PASSWORD}
          MQTT_PYTHON_USER: ${MQTT_PYTHON_USER}
          MQTT_PYTHON_USERPW: ${MQTT_PYTHON_USERPW}
          IPV4_NETWORK: ${IPV4_NETWORK}
        volumes:
            - ./scripts/pm2/:/opt/scripts/:ro
        depends_on:
            - ngnt-geiger-mariadb
            - ngnt-geiger-mosquitto
        networks:
            ngnt-geiger-network:
                ipv4_address: ${IPV4_NETWORK}.40
                aliases:
                    - subscriber


networks:
   ngnt-geiger-network:
     driver: bridge
     driver_opts:
       com.docker.network.bridge.name: br-ngnt-geiger
     ipam:
       driver: default
       config:
         - subnet: ${IPV4_NETWORK}.0/24
