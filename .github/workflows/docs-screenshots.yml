name: Docs screenshots

# Regenerates the docs screenshots (docs/screenshots/*.png) with
# ngnt-geiger-dockerized/scripts/docs-screenshots.sh: builds the Flask image,
# starts a throwaway Flask + MariaDB stack, seeds the demo data
# (e2e/docs/seed.ts) and runs the docs tour. The PNGs come back as the
# `docs-screenshots` artifact - this workflow never commits. Unzip it into
# docs/screenshots/, look at the diff, and commit it yourself.
#
# Manual only: each regeneration adds PNGs to the history. The same tour runs
# as a render check in ci.yml on every push.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Playwright
        working-directory: ngnt-geiger-dockerized/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the docs tour
        run: ARTIFACTS="$RUNNER_TEMP/docs-run" ngnt-geiger-dockerized/scripts/docs-screenshots.sh "$RUNNER_TEMP/screenshots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots
          path: ${{ runner.temp }}/screenshots/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: docs-run
          path: ${{ runner.temp }}/docs-run/
          retention-days: 7
