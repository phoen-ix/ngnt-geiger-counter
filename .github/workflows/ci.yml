name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ngnt-geiger-dockerized
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: ngnt-geiger-dockerized/app/requirements*.txt

      - name: Install
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Test
        run: python -m pytest

      # The installed environment, not pip-audit's own dependencies: freeze first,
      # then run pip-audit through pipx (preinstalled on the runners).
      - name: Audit dependencies
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-frozen.txt"
          pipx run pip-audit -r "$RUNNER_TEMP/requirements-frozen.txt" --no-deps --disable-pip --progress-spinner off

  # The docs tour as a render check: every screen of the dashboard in a real
  # browser against a fresh Flask + MariaDB stack, failing on a missing element,
  # an uncaught page error or a request leaving the stack. Its PNGs are never
  # committed; docs-screenshots.yml makes those.
  docs-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Playwright
        working-directory: ngnt-geiger-dockerized/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Docs tour (render check)
        run: ARTIFACTS="$RUNNER_TEMP/docs-run" ngnt-geiger-dockerized/scripts/docs-screenshots.sh "$RUNNER_TEMP/screenshots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: docs-tour
          path: |
            ${{ runner.temp }}/docs-run/
            ${{ runner.temp }}/screenshots/
          retention-days: 7
